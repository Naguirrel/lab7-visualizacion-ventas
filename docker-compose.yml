services:
  postgres:
    image: postgres:16
    container_name: retailmax-postgres
    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: retailmax

    ports:
      - "5432:5432"

    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./DDL.sql:/docker-entrypoint-initdb.d/1-DDL.sql
      - ./DATA.sql:/docker-entrypoint-initdb.d/2-DATA.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d retailmax"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: retailmax-metabase
    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3000:3000"

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: retailmax
      MB_DB_PORT: 5432
      MB_DB_USER: admin
      MB_DB_PASS: admin123
      MB_DB_HOST: postgres

    volumes:
      - ./metabase-data:/metabase-data